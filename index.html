<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة النقل المدرسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ink:#14213d; --ink2:#5b6478; --line:#e3e7ee; --bg:#f5f7fa; --card:#fff;
  --bus:#f7b801; --busink:#1a1400;
  --ok:#1f9d63; --okbg:#e6f6ee; --bad:#d6403a; --badbg:#fdeceb; --late:#e08a00; --latebg:#fff3dc;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bus);outline-offset:2px}
.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.topbar .brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
.plate{background:var(--bus);color:var(--busink);font-weight:700;border-radius:8px;padding:0 10px;min-width:38px;text-align:center;display:inline-block;line-height:32px;border:2px solid var(--busink)}
.topbar .sp{flex:1}
.role{font-size:13px;opacity:.8}
.dot{width:9px;height:9px;border-radius:50%;background:#7e8aa3;display:inline-block;margin-inline-end:6px}
.dot.ok{background:#3ddc97}.dot.err{background:#ff6b6b}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:14px 14px;font-weight:500;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--bus);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0 0 14px;font-size:22px}
h3{margin:0 0 10px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g-buses{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bus{cursor:pointer;text-align:start;display:block;width:100%;transition:border-color .15s}
.bus:hover{border-color:var(--ink)}
.bus .plate{font-size:22px;line-height:44px;padding:0 16px;margin-bottom:10px}
.bus .sup{font-weight:600}
.bus .meta{color:var(--ink2);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok)}
.kpi .n{font-size:30px;font-weight:700;line-height:1.2}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi.ok .n{color:var(--ok)}.kpi.bad .n{color:var(--bad)}.kpi.late .n{color:var(--late)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.bus{background:var(--bus);color:var(--busink);border-color:var(--busink);font-weight:700;display:inline-block;width:auto;padding:8px 14px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;width:100%}
.inline input,.inline select{width:auto}
label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.field{margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 16px;font-weight:500;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--ink);color:#fff}
.stu{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stu:last-child{border:0}
.stu .nm{flex:1;min-width:170px}
.stu .nm b{display:block}
.stu .nm span{color:var(--ink2);font-size:13px}
.stu a{color:var(--ink);text-decoration:none;font-size:14px;direction:ltr;unicode-bidi:embed}
.mk{display:flex;gap:6px}
.mk button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font-weight:600;min-width:72px}
.mk button.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.mk button.A.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.mk button.L.on{background:var(--late);color:#fff;border-color:var(--late)}
.mk button:disabled{opacity:.6;cursor:default}
.chip{display:inline-block;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:600}
.chip.P{background:var(--okbg);color:var(--ok)}.chip.A{background:var(--badbg);color:var(--bad)}.chip.L{background:var(--latebg);color:var(--late)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
th{background:#f0f3f8;font-weight:600}
.scroll{overflow-x:auto}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:var(--r);padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.login{max-width:380px;margin:9vh auto;padding:30px 16px}
.login .roles{display:grid;gap:10px;margin:18px 0}
.login .roles button{padding:16px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:start;font-weight:600}
.login .roles button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.empty{color:var(--ink2);text-align:center;padding:28px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.sheet{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sheet table{min-width:640px}
@media (max-width:640px){.sheet{padding:14px}.sheet h1{font-size:18px}.sheet th,.sheet td{padding:7px 8px;font-size:13px}}
.sheet h1{font-size:22px;margin:0 0 4px}
.logo-brand{height:34px;width:auto;display:inline-block;vertical-align:middle}
.logo-login{height:96px;width:auto;margin:0 auto 6px;display:block}
.sheet-logo{height:70px;width:auto;display:block;margin:0 auto 8px}
@media (max-width:640px){.logo-login{height:78px}.logo-brand{height:28px}}
.sheet h4{margin:20px 0 8px;font-size:16px}
.sheet table th,.sheet table td{border:1px solid #bfc6d4}
.note{font-size:13px;color:var(--ink2)}
pre{background:#f0f3f8;padding:10px;border-radius:8px;overflow:auto;direction:ltr;text-align:left;font-size:12px}
.wa{color:#128c7e;font-weight:600;text-decoration:none;direction:ltr;unicode-bidi:embed;display:inline-block}
.wa::before{content:'💬 '}
.wa:hover{text-decoration:underline}
.btn.pri{text-decoration:none;display:inline-block}
@media print{
  body{background:#fff}
  .no-print,.topbar,.tabs,.toast,#modal{display:none!important}
  main{max-width:none;padding:0}
  .sheet{border:0;padding:0;overflow:visible}
  .sheet table{min-width:0}
  .card{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

/* ===================== أدوات عامة ===================== */
const KEY='schoolbus_state_v1', CFGKEY='schoolbus_sb';

const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

async function sbPush(){
  const c=cfg();if(!c)return;
  const D=getDirty();if(!isDirty(D))return;
  try{
    const remote=D.full?null:await sbFetch(c);
    let next;
    if(!remote)next=JSON.parse(JSON.stringify(state));
    else{
      next=remote;
      if(D.meta){next.settings=state.settings;next.users=state.users;next.buses=state.buses;next.students=state.students}

    if(!r.ok)throw new Error(r.status);
    const now=getDirty();now.full=Math.max(0,now.full-D.full);now.meta=Math.max(0,now.meta-D.meta);now.ops=now.ops.slice(D.ops.length);setDirty(now);

async function sbPull(){

function rangeDates(period,ds){
  const d=parseD(ds);
  if(period==='daily')return [ds];
  if(period==='weekly'){const s=new Date(d);s.setDate(d.getDate()-d.getDay());return Array.from({length:7},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return fmt(x)})}
  const n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return Array.from({length:n},(_,i)=>fmt(new Date(d.getFullYear(),d.getMonth(),i+1)));
}
function periodLabel(period,ds){
  const r=rangeDates(period,ds);
  if(period==='daily')return full(ds);
  return 'من '+both(r[0])+' إلى '+both(r[r.length-1]);
}
function stats(dates,busId,trip){
  const ids=new Set(state.students.filter(s=>!busId||s.busId===busId).map(s=>s.id));
  const stuMap=Object.fromEntries(state.students.map(s=>[s.id,s]));
  const t={P:0,A:0,L:0},byBus={},byDate={},byStu={},rows=[];
  state.buses.forEach(b=>byBus[b.id]={P:0,A:0,L:0});
  const trips=trip?[trip]:['go','back'];
  dates.forEach(d=>{
    byDate[d]={P:0,A:0,L:0};
    trips.forEach(tr=>{
      const day=att(d,tr);
      for(const sid in day){
        if(!ids.has(sid))continue;const s=stuMap[sid],st=day[sid];
        t[st]++;byDate[d][st]++;
        if(byBus[s.busId])byBus[s.busId][st]++;
        (byStu[sid]=byStu[sid]||{P:0,A:0,L:0})[st]++;
        rows.push({date:d,trip:tr,s,st});
      }
    });
  });
  return {t,byBus,byDate,byStu,rows,total:t.P+t.A+t.L};
}

/* ===================== تصدير Word (docx حقيقي) ===================== */
function exportDocx(){
  const X=t=>(t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  const para=(txt,o={})=>`<w:p><w:pPr><w:bidi/><w:jc w:val="${o.align||'right'}"/>${o.sb?'<w:spacing w:before="'+o.sb+'"/>':''}</w:pPr><w:r><w:rPr><w:rtl/>${o.b?'<w:b/>':''}${o.sz?'<w:sz w:val="'+(o.sz*2)+'"/>':''}${o.color?'<w:color w:val="'+o.color+'"/>':''}</w:rPr><w:t xml:space="preserve">${X(txt)}</w:t></w:r></w:p>`;
  const BORD=['top','left','bottom','right','insideH','insideV'].map(e=>`<w:${e} w:val="single" w:sz="4" w:space="0" w:color="888888"/>`).join('');
  function tableXml(tb){
    const rows=[...tb.rows].map(r=>[...r.cells].map(c=>({t:c.textContent.trim(),h:c.tagName==='TH',s:c.colSpan||1})));
    let max=0;rows.forEach(r=>{let n=0;r.forEach(c=>n+=c.s);if(n>max)max=n});
    const grid='<w:tblGrid>'+Array.from({length:max},()=>'<w:gridCol w:w="'+Math.floor(9000/max)+'"/>').join('')+'</w:tblGrid>';
    const body=rows.map(r=>'<w:tr>'+r.map(c=>`<w:tc><w:tcPr>${c.s>1?'<w:gridSpan w:val="'+c.s+'"/>':''}${c.h?'<w:shd w:val="clear" w:fill="EEEEEE"/>':''}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:bidi/><w:jc w:val="right"/></w:pPr><w:r><w:rPr><w:rtl/>${c.h?'<w:b/>':''}<w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${X(c.t)}</w:t></w:r></w:p></w:tc>`).join('')+'</w:tr>').join('');
    return `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${BORD}</w:tblBorders></w:tblPr>${grid}${body}</w:tbl>`;
  }
  let body='';
  (function walk(node){
    node.childNodes.forEach(n=>{
      if(n.nodeType!==1)return;
      const tag=n.tagName;
      if(tag==='IMG')return;
      else if(tag==='H1')body+=para(n.textContent.trim(),{b:true,sz:16,align:'center'});
      else if(tag==='H2')body+=para(n.textContent.trim(),{b:true,sz:12,align:'center'});
      else if(tag==='H3')body+=para(n.textContent.trim(),{b:true,sz:11});
      else if(n.classList&&n.classList.contains('note'))body+=para(n.textContent.trim(),{sz:9,align:'center',color:'666666'});
      else if(tag==='TABLE'){body+=tableXml(n);body+=para('',{sz:6});}
      else walk(n);
    });
  })($('#sheet'));
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:bidi/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720"/></w:sectPr></w:body></w:document>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const zip=new JSZip();
  zip.file('[Content_Types].xml',ct);
  zip.folder('_rels').file('.rels',rels);
  zip.folder('word').file('document.xml',doc);
  zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}).then(blob=>{
    download(blob,'كشف-النقل-'+ui.pdate+'.docx');
  });
}
function buildReport(){
  const k=ui.repType,tr=ui.rTrip,b=ui.repBus?busOf(ui.repBus):null;
  const head=state.users.find(u=>u.role==='head');
  const stat=['daily','weekly','monthly'].includes(k);
  let sub;
  if(k==='sheet')sub=full(ui.pdate)+(tr?' · رحلة '+TRIP[tr]:' · الذهاب والعودة');
  else if(stat)sub=periodLabel(k,ui.pdate)+(tr?' · رحلة '+TRIP[tr]:' · الذهاب والعودة');
  else sub='بتاريخ '+full(today());
  const buses=b?[b]:state.buses;
  let h=`<img class="sheet-logo" src="${LOGO}" alt="شعار الشركة"><h1 style="text-align:center">${esc(state.settings.school)}</h1><h2 style="text-align:center;font-size:16px;font-weight:600;margin:0 0 4px;color:var(--ink)">${REP[k].replace(' (للطباعة)','')}</h2><div class="note">${sub}${b&&k!=='buses'&&!stat?'':''}${b&&stat?' · '+esc(busFull(b)):''}</div>`;

  if(k==='buses'){
    h+=`<table data-name="الباصات" style="margin-top:12px"><tr><th>م</th><th>رقم الباص</th><th>اسم الباص</th><th>السائق</th><th>جوال السائق</th><th>المشرفة</th><th>جوال المشرفة</th><th>الأحياء</th><th>عدد الطلاب</th></tr>${buses.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.number)}</td><td>${esc(x.name||'')}</td><td>${esc(x.driver||'')}</td><td>${esc(x.driverPhone||'')}</td><td>${esc(x.supervisor||'')}</td><td>${esc(x.supPhone||'')}</td><td>${esc(x.hoods||'')}</td><td>${stuOf(x.id).length}</td></tr>`).join('')}</table>`;
  }else if(k==='roster'){
    buses.forEach((x,i)=>{
      h+=`<div style="margin-top:14px;${i<buses.length-1?'page-break-after:always;break-after:page':''}"><table data-name="باص ${esc(x.number)}">${infoRow(x,7)}<tr><th>م</th><th>اسم الطالب</th><th>المرحلة</th><th>الفصل</th><th>الحي</th><th>ولي الأمر</th><th>جوال ولي الأمر</th></tr>${stuOf(x.id).map((s,j)=>`<tr><td>${j+1}</td><td>${esc(s.name)}</td><td>${esc(s.stage||'')}</td><td>${esc(s.cls||'')}</td><td>${esc(s.hood||'')}</td><td>${esc(s.parent||'')}</td><td>${esc(s.phone||'')}</td></tr>`).join('')||'<tr><td colspan="7">لا يوجد طلاب</td></tr>'}</table></div>`;
    });
  }else if(k==='sheet'){
    const cols=tr?8:9;
    buses.forEach((x,i)=>{
      h+=`<div style="margin-top:14px;${i<buses.length-1?'page-break-after:always;break-after:page':''}"><table data-name="باص ${esc(x.number)}">${infoRow(x,cols)}<tr><th>م</th><th>اسم الطالب</th><th>المرحلة</th><th>الفصل</th><th>الحي</th><th>جوال ولي الأمر</th>${tr?`<th>${TRIP[tr]}</th>`:'<th>الذهاب</th><th>العودة</th>'}<th>ملاحظات</th></tr>${stuOf(x.id).map((s,j)=>{
        const g=ST[att(ui.pdate,'go')[s.id]]||'',r=ST[att(ui.pdate,'back')[s.id]]||'';
        return `<tr><td>${j+1}</td><td>${esc(s.name)}</td><td>${esc(s.stage||'')}</td><td>${esc(s.cls||'')}</td><td>${esc(s.hood||'')}</td><td>${esc(s.phone||'')}</td>${tr?`<td>${tr==='go'?g:r}</td>`:`<td>${g}</td><td>${r}</td>`}<td></td></tr>`}).join('')||`<tr><td colspan="${cols}">لا يوجد طلاب</td></tr>`}</table></div>`;
    });
  }else{
    const dates=rangeDates(k,ui.pdate),S=stats(dates,ui.repBus||null,tr);
    h+=`<h4>الملخص</h4><table data-name="الملخص"><tr><th>الحضور</th><th>الغياب</th><th>التأخير</th><th>إجمالي التسجيلات</th><th>نسبة الحضور</th></tr><tr><td>${S.t.P}</td><td>${S.t.A}</td><td>${S.t.L}</td><td>${S.total}</td><td>${pct(S.t.P,S.total)}%</td></tr></table>`;
    if(!b)h+=`<h4>حسب الباص</h4>${busTable(S,'الباصات')}`;
    else h+=`<h4>حسب الطالب</h4><table data-name="الطلاب"><tr><th>الطالب</th><th>المرحلة</th><th>الفصل</th><th>جوال ولي الأمر</th><th>حضور</th><th>غياب</th><th>تأخير</th></tr>${stuOf(b.id).map(s=>{const x=S.byStu[s.id]||{P:0,A:0,L:0};return `<tr><td>${esc(s.name)}</td><td>${esc(s.stage||'')}</td><td>${esc(s.cls||'')}</td><td>${esc(s.phone||'')}</td><td>${x.P}</td><td>${x.A}</td><td>${x.L}</td></tr>`}).join('')}</table>`;
    const lst=S.rows.filter(r=>r.st!=='P').sort((a,c)=>a.date<c.date?-1:a.date>c.date?1:0);
    h+=`<h4>الغائبون والمتأخرون</h4>`+(lst.length?`<table data-name="الغياب والتأخير"><tr><th>التاريخ</th><th>الرحلة</th><th>الطالب</th><th>الفصل</th><th>الباص</th><th>الحالة</th><th>ولي الأمر</th><th>الجوال</th></tr>${lst.map(r=>`<tr><td>${both(r.date)}</td><td>${TRIP[r.trip]}</td><td>${esc(r.s.name)}</td><td>${esc(clsText(r.s))}</td><td>${esc(busOf(r.s.busId)?.number||'')}</td><td>${ST[r.st]}</td><td>${esc(r.s.parent||'')}</td><td>${esc(r.s.phone||'')}</td></tr>`).join('')}</table>`:'<p>لا توجد حالات غياب أو تأخير.</p>');
  }
  h+=`<p class="note" style="margin-top:22px">مشرفة البرنامج الرئيسية: ${esc(head?head.name:'')}${head&&head.phone?' — '+esc(head.phone):''}</p>`;
  return h;
}

/* ===================== الإجراءات ===================== */
function doLogin(){
  const p=($('#pin')||{}).value;
  if(ui.loginUser===OWNER.id){if(p===OWNER.pin){ui.uid=OWNER.id;ui.tab='dashboard';ui.busId=null;sessionStorage.setItem('sb_uid',OWNER.id);render()}else alert('رقم سري غير صحيح');return}
  const u=state.users.find(x=>x.id===ui.loginUser);
  if(u&&p===u.pin){ui.uid=u.id;ui.tab=u.role==='head'?'buses':'dashboard';ui.busId=null;sessionStorage.setItem('sb_uid',u.id);render()}
  else toast('الرقم السري غير صحيح');
}
function waBtn(s,st){const h=waHref(s,st,ui.date,ui.trip);return h?`<a class="btn pri sm" href="${h}" target="_blank" rel="noopener">إرسال واتساب</a>`:'<span class="note">لا يوجد رقم</span>'}
const A={
  luser:t=>{ui.loginUser=t.dataset.id;render()},
  login:doLogin,
  logout:()=>{ui.uid=null;sessionStorage.removeItem('sb_uid');if(location.hash==='#'+OWNER_KEY){history.replaceState(null,'',location.pathname+location.search)}render()},
  tab:t=>{ui.tab=t.dataset.v;if(ui.tab!=='buses')ui.busId=null;render()},
  openbus:t=>{ui.busId=t.dataset.id;ui.date=today();render();scrollTo(0,0)},
  backbuses:()=>{ui.busId=null;render()},
  trip:t=>{ui.trip=t.dataset.v;render()},
  mark:t=>{
    if(!isHead())return;const d=ui.date;
    state.attendance[d]=state.attendance[d]||{go:{},back:{}};
    const day=state.attendance[d][ui.trip]=state.attendance[d][ui.trip]||{};
    const id=t.dataset.id,v=day[id]===t.dataset.s?null:t.dataset.s;
    if(v)day[id]=v;else delete day[id];
    save({ops:[{d,t:ui.trip,s:id,v}]});const y=scrollY;render();scrollTo(0,y);toast('تم الحفظ ✓');
  },
  allP:()=>{const d=ui.date;state.attendance[d]=state.attendance[d]||{go:{},back:{}};const day=state.attendance[d][ui.trip]=state.attendance[d][ui.trip]||{};const ops=[];stuOf(ui.busId).forEach(s=>{if(!day[s.id]){day[s.id]='P';ops.push({d,t:ui.trip,s:s.id,v:'P'})}});save({ops});render();toast('تم الحفظ ✓')},
  msgs:()=>{
    const day=att(ui.date,ui.trip),l=stuOf(ui.busId).filter(s=>day[s.id]==='A'||day[s.id]==='L');
    if(!l.length){toast('لا يوجد غائبون أو متأخرون');return}
    openModal(`<h3>رسائل أولياء الأمور</h3><p class="note">${full(ui.date)} · رحلة ${TRIP[ui.trip]}</p>`+l.map(s=>`<div class="stu"><div class="nm"><b>${esc(s.name)}</b><span class="chip ${day[s.id]}">${ST[day[s.id]]}</span></div>${waBtn(s,day[s.id])}</div>`).join('')+`<div style="margin-top:12px"><button class="btn" data-act="close">إغلاق</button></div>`);
  },
  period:t=>{ui.period=t.dataset.v;render()},
  dtrip:t=>{ui.dTrip=t.dataset.v;render()},
  addstu:()=>stuForm(),
  editstu:t=>stuForm(state.students.find(s=>s.id===t.dataset.id)),
  delstu:t=>{if(confirm('حذف هذا الطالب؟')){const id=t.dataset.id;state.students=state.students.filter(s=>s.id!==id);Object.values(state.attendance).forEach(d=>{delete (d.go||{})[id];delete (d.back||{})[id]});save();render()}},
  addbus:()=>busForm(),
  editbus:t=>busForm(busOf(t.dataset.id)),
  delbus:t=>{const id=t.dataset.id;if(stuOf(id).length){alert('انقلي طلاب هذا الباص إلى باص آخر أولًا.');return}if(confirm('حذف هذا الباص؟')){state.buses=state.buses.filter(b=>b.id!==id);save();render()}},
  importstu:()=>pickFile('.xlsx,.xls,.csv',importExcel),
  templ:()=>{const ws=XLSX.utils.aoa_to_sheet([['اسم الطالب','المرحلة','الفصل','الحي','رقم الباص','اسم الباص','السائق','جوال السائق','المشرفة','جوال المشرفة','ولي الأمر','جوال ولي الأمر'],['سارة محمد','الأول المتوسط','2','النزهة','1','باص الفجر','عبدالله','0500000000','أم محمد','0500000001','محمد','0500000002']]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الطلاب');wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,'نموذج-استيراد-الطلاب.xlsx')},
  exWord:()=>{try{exportDocx()}catch(e){alert('تعذّر إنشاء ملف Word')}},
  exXlsx:()=>{
    const wb=XLSX.utils.book_new(),used=new Set();
    $('#sheet').querySelectorAll('table').forEach((tb,i)=>{
      let n=(tb.dataset.name||'ورقة'+(i+1)).replace(/[:\\\/?*\[\]]/g,'').slice(0,28)||'ورقة',k=n,c=2;
      while(used.has(k))k=n+' '+(c++);used.add(k);
      XLSX.utils.book_append_sheet(wb,XLSX.utils.table_to_sheet(tb),k);
    });
    wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,'كشف-النقل-'+ui.pdate+'.xlsx');
  },
  exPdf:()=>{toast('اختاري «حفظ كـ PDF» من نافذة الطباعة');setTimeout(print,600)},
  saveset:()=>{state.settings.cc=($('#sCc').value.replace(/\D/g,''))||'966';save();render();toast('تم الحفظ ✓')},
  savetpl:()=>{state.settings.tpl={A:$('#tA').value,L:$('#tL').value,G:$('#tG').value};save();toast('تم الحفظ ✓')},
  restpl:()=>{if(confirm('استعادة النصوص الافتراضية؟')){state.settings.tpl={...DEF_TPL};save();render()}},
  adduser:()=>userForm(),
  edituser:t=>userForm(state.users.find(u=>u.id===t.dataset.id)),
  deluser:t=>{
    const u=state.users.find(x=>x.id===t.dataset.id);
    if(u.role==='admin'&&state.users.filter(x=>x.role==='admin').length<2){alert('يجب أن يبقى مستخدم واحد على الأقل بصلاحية الإدارة.');return}
    if(confirm('حذف هذا المستخدم؟')){state.users=state.users.filter(x=>x.id!==u.id);save();if(u.id===ui.uid){ui.uid=null}render()}
  },
  backup:()=>download(new Blob([JSON.stringify(state)],{type:'application/json'}),'نسخة-النقل-'+today()+'.json'),
  restore:()=>pickFile('.json',f=>{const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.buses)throw 0;state=migrate(s);save('full');render();toast('تم الاسترجاع ✓')}catch(e){alert('الملف غير صالح')}};r.readAsText(f)}),
  demo:()=>{if(confirm('سيتم استبدال بيانات الباصات والطلاب ببيانات تجريبية. متابعة؟')){loadDemo();save('full');render()}},
  reset:()=>{if(confirm('سيتم حذف بيانات الباصات والطلاب والحضور نهائيًا من كل الأجهزة. متابعة؟')){const s=state.settings,u=state.users;state=defaultState();state.settings=s;state.users=u;save('full');render()}}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){if(t.dataset.act==='close'){closeModal();return}A[t.dataset.act]&&A[t.dataset.act](t,e)}
  else if(e.target.id==='modal')closeModal();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.chg;if(!k)return;
  if(k==='attdate')ui.date=e.target.value||today();
  else if(k==='pdate')ui.pdate=e.target.value||today();
  else ui[k]=e.target.value;
  render();
});

/* ---- نوافذ الإدخال ---- */
function openModal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
const fld=(id,label,v,extra='')=>`<div class="field"><label>${label}</label><input id="${id}" value="${esc(v||'')}" ${extra}></div>`;
function stuForm(s){
  s=s||{busId:ui.stuBus||(state.buses[0]||{}).id};
  openModal(`<h3>${s.id?'تعديل طالب':'إضافة طالب'}</h3>
  ${fld('f_name','اسم الطالب',s.name)}
  ${fld('f_stage','المرحلة الدراسية (مثال: الثاني المتوسط)',s.stage)}
  ${fld('f_cls','اسم الفصل (مثال: 3 أو ب)',s.cls)}
  <div class="field"><label>الباص</label><select id="f_bus">${state.buses.map(b=>`<option value="${b.id}" ${b.id===s.busId?'selected':''}>${esc(busFull(b))}</option>`).join('')}</select></div>
  ${fld('f_hood','الحي',s.hood)}
  ${fld('f_parent','اسم ولي الأمر',s.parent)}
  ${fld('f_phone','جوال ولي الأمر',s.phone,'inputmode="tel" dir="ltr"')}
  <div class="row"><button class="btn pri" id="fsave">حفظ</button><button class="btn" data-act="close">إلغاء</button></div>`);
  $('#fsave').onclick=()=>{
    const name=$('#f_name').value.trim();if(!name){toast('اكتبي اسم الطالب');return}
    const o={name,stage:$('#f_stage').value.trim(),cls:$('#f_cls').value.trim(),busId:$('#f_bus').value,hood:$('#f_hood').value.trim(),parent:$('#f_parent').value.trim(),phone:$('#f_phone').value.trim()};
    if(s.id)Object.assign(state.students.find(x=>x.id===s.id),o);else state.students.push({id:uid(),...o});
    save();closeModal();render();toast('تم الحفظ ✓');
  };
}
function busForm(b){
  b=b||{};
  openModal(`<h3>${b.id?'تعديل باص':'إضافة باص'}</h3>
  ${fld('f_num','رقم الباص',b.number)}
  ${fld('f_bname','اسم الباص (اختياري)',b.name)}
  ${fld('f_drv','اسم السائق',b.driver)}
  ${fld('f_dp','جوال السائق',b.driverPhone,'inputmode="tel" dir="ltr"')}
  ${fld('f_sup','اسم مشرفة الباص',b.supervisor)}
  ${fld('f_sp','جوال المشرفة',b.supPhone,'inputmode="tel" dir="ltr"')}
  ${fld('f_hoods','الأحياء التي يمر بها (افصلي بينها بفاصلة)',b.hoods)}
  <div class="row"><button class="btn pri" id="fsave">حفظ</button><button class="btn" data-act="close">إلغاء</button></div>`);
  $('#fsave').onclick=()=>{
    const number=$('#f_num').value.trim();if(!number){toast('اكتبي رقم الباص');return}
    const o={number,name:$('#f_bname').value.trim(),driver:$('#f_drv').value.trim(),driverPhone:$('#f_dp').value.trim(),supervisor:$('#f_sup').value.trim(),supPhone:$('#f_sp').value.trim(),hoods:$('#f_hoods').value.trim()};
    if(b.id)Object.assign(busOf(b.id),o);else state.buses.push({id:uid(),...o});
    save();closeModal();render();toast('تم الحفظ ✓');
  };
}
function userForm(u){
  u=u||{role:'admin'};
  openModal(`<h3>${u.id?'تعديل مستخدم':'إضافة مستخدم'}</h3>
  ${fld('u_name','الاسم',u.name)}
  ${fld('u_phone','الجوال',u.phone,'inputmode="tel" dir="ltr"')}
  <div class="field"><label>الصلاحية</label><select id="u_role"><option value="head" ${u.role==='head'?'selected':''}>المشرفة — تسجيل الحضور والتأخير فقط</option><option value="admin" ${u.role==='admin'?'selected':''}>الإدارة — التقارير والإحصائيات والاستيراد والإعدادات</option></select></div>
  ${fld('u_pin','الرقم السري',u.pin,'inputmode="numeric"')}
  <div class="row"><button class="btn pri" id="fsave">حفظ</button><button class="btn" data-act="close">إلغاء</button></div>`);
  $('#fsave').onclick=()=>{
    const name=$('#u_name').value.trim(),pin=$('#u_pin').value.trim();
    if(!name||!pin){toast('الاسم والرقم السري مطلوبان');return}
    const o={name,phone:$('#u_phone').value.trim(),role:$('#u_role').value,pin};
    if(u.id){
      if(u.role==='admin'&&o.role!=='admin'&&state.users.filter(x=>x.role==='admin').length<2){alert('يجب أن يبقى مستخدم واحد على الأقل بصلاحية الإدارة.');return}
      Object.assign(state.users.find(x=>x.id===u.id),o);
    }else state.users.push({id:uid(),...o});
    save();closeModal();render();toast('تم الحفظ ✓');
  };
}

/* ---- ملفات ---- */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function pickFile(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}
function fixPhone(v){let d=String(v||'').trim();if(/^5\d{8}$/.test(d))d='0'+d;return d}
function importExcel(f){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const pick=(x,keys)=>{for(const k of keys)if(String(x[k]??'').trim()!=='')return String(x[k]).trim();return ''};
      let n=0;
      rows.forEach(x=>{
        const name=pick(x,['اسم الطالب','الاسم']);if(!name)return;
        const num=pick(x,['رقم الباص','الباص']);
        let bus=state.buses.find(b=>b.number===num);
        if(!bus&&num){bus={id:uid(),number:num,name:'',driver:'',driverPhone:'',supervisor:'',supPhone:'',hoods:''};state.buses.push(bus)}
        if(!bus)bus=state.buses[0];
        const fill=(k,v)=>{if(bus&&v&&!bus[k])bus[k]=v};
        fill('name',pick(x,['اسم الباص']));fill('driver',pick(x,['السائق','اسم السائق']));fill('driverPhone',fixPhone(pick(x,['جوال السائق'])));
        fill('supervisor',pick(x,['المشرفة','اسم المشرفة']));fill('supPhone',fixPhone(pick(x,['جوال المشرفة'])));
        state.students.push({id:uid(),name,stage:pick(x,['المرحلة','المرحلة الدراسية','الصف']),cls:pick(x,['الفصل','اسم الفصل']),busId:bus.id,hood:pick(x,['الحي','العنوان']),parent:pick(x,['ولي الأمر','اسم ولي الأمر']),phone:fixPhone(pick(x,['جوال ولي الأمر','الجوال','رقم ولي الأمر']))});n++;
      });
      save();render();toast('تم استيراد '+n+' طالب');
    }catch(e){alert('تعذّرت قراءة الملف')}
  };
  r.readAsArrayBuffer(f);
}

/* ---- بيانات تجريبية ---- */
function loadDemo(){
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const first=['محمد','عبدالله','فهد','سلمان','ريم','لينا','سارة','نورة','أحمد','خالد','هند','جود','يوسف','تالا','عمر'],fam=['العتيبي','الحربي','الغامدي','الزهراني','القحطاني','السلمي','المالكي','الشهري'];
  const sups=['أم محمد','أم عبدالله','أم فهد','أم سلمان','أم خالد','أم أحمد','أم يوسف','أم عمر','أم سعد','أم تركي'];
  const drv=['عبدالرحمن','سعيد','ماجد','ناصر','بدر','علي','صالح','إبراهيم','حمد','طلال'];
  const hoods=['النزهة','الروضة','العزيزية','الشرائع','الزاهر','العوالي'];
  const ph=()=>''; /* بيانات تجريبية بدون أرقام جوال */
  const st=defaultState();st.settings=state.settings;st.users=state.users;
  st.buses.forEach((b,i)=>{b.name='باص '+['الفجر','النور','الأمل','السلام','الريان','المنار','الوفاء','البشائر','الهدى','الزهور'][i];b.supervisor=sups[i];b.supPhone=ph();b.driver=drv[i];b.driverPhone=ph();b.hoods=hoods[i%6]+'، '+hoods[(i+2)%6]});
  st.buses.forEach(b=>{for(let k=0;k<8;k++){st.students.push({id:uid(),name:rnd(first)+' '+rnd(fam),stage:['الأول','الثاني','الثالث'][k%3]+' المتوسط',cls:String(1+k%4),busId:b.id,hood:hoods[k%6],parent:'أبو '+rnd(first),phone:ph()})}});
  const now=new Date();
  for(let i=0;i<35;i++){const d=new Date(now);d.setDate(now.getDate()-i);if([5,6].includes(d.getDay()))continue;const key=fmt(d);st.attendance[key]={go:{},back:{}};['go','back'].forEach(tr=>st.students.forEach(s=>{const r=Math.random();st.attendance[key][tr][s.id]=r<.88?'P':r<.95?'A':'L'}))}
  state=migrate(st);
}

ui.uid=sessionStorage.getItem('sb_uid');if(ui.uid===OWNER.id&&location.hash!=='#'+OWNER_KEY){ui.uid=null;sessionStorage.removeItem('sb_uid')}
if(ui.uid&&me())ui.tab=isHead()?'buses':'dashboard';
render();schedule(sbPull);sbRealtime();
